name: Uganda Scholarship Monitor
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-scholarships:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check for new scholarships
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ALERT_EMAIL: reaganpatrickl896@gmail.com
        run: python scholarship_monitor.py
      - name: Save updated scholarship state
        run: |
          if [ -n "$(git status --porcelain seen_scholarships.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_scholarships.json
            git commit -m "Update seen scholarships state"
            git push
          else
            echo "No changes to seen_scholarships.json"
          fi
